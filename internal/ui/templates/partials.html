{{define "tabs"}}
<nav class="tabs" aria-label="{{.Text.nav_label}}">
  {{range .Tabs}}<a class="tab" href="{{.Path}}"{{if eq .Path $.ActiveTab}} aria-current="page"{{end}}>{{index $.Text .Key}}</a>
  {{end}}
</nav>
{{end}}

{{define "page-help"}}
<a class="help" href="https://github.com/LokiVPN/keen-proxy/blob/master/docs/{{.Lang}}/user-guide.md#{{if .Setup}}first-run{{else if eq .ActiveTab "/"}}overview{{else if eq .ActiveTab "/routing"}}routing{{else if eq .ActiveTab "/devices"}}devices{{else if eq .ActiveTab "/connections"}}connections{{else}}diagnostics{{end}}" aria-label="{{.Text.setup_help}}">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .4c0 1.7-2.5 2-2.5 3.6M12 16h.01"/></svg>
</a>
{{end}}

{{define "view-note"}}
<div class="note view-note">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="1.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
  <div><strong>{{.Text.view_title}}</strong><p>{{.Text.view_hint}}</p></div>
</div>
{{end}}

{{define "chart"}}
<div class="chart" role="img" aria-label="{{.Label}}">
  <div class="chart-y" aria-hidden="true"><span>{{.Top}}</span><span>{{.Mid}}</span><span>0</span></div>
  <svg viewBox="0 0 668 122" preserveAspectRatio="none" aria-hidden="true">
    <path class="grid" d="M0 0 H668 M0 61 H668 M0 122 H668" vector-effect="non-scaling-stroke"/>
    {{if .Sample}}
    <circle class="rx-point" cx="{{.Sample.X}}" cy="{{.Sample.RX}}" r="3"/>
    <circle class="tx-point" cx="{{.Sample.X}}" cy="{{.Sample.TX}}" r="3"/>
    {{else if .RX}}
    <path class="rx-a" d="{{.RXArea}}"/>
    <path class="tx-a" d="{{.TXArea}}"/>
    <path class="rx-l" d="{{.RX}}" vector-effect="non-scaling-stroke"/>
    <path class="tx-l" d="{{.TX}}" vector-effect="non-scaling-stroke"/>
    {{end}}
  </svg>
  <div class="chart-x" aria-hidden="true">{{range .Times}}<span>{{.}}</span>{{end}}</div>
</div>
{{end}}
